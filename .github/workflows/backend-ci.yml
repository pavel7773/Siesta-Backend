name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test (JDK 21, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-postgres-password
          POSTGRES_DB: catering_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d catering_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_PASSWORD: ci-local-postgres-password
      CATERING_DB_PASSWORD: ci-local-postgres-password
      CATERING_JWT_SECRET: ci-only-jwt-signing-secret-change-in-production
      ACCOUNT_CODE_HMAC_SECRET: ci-only-code-hmac-secret-32-plus-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Run unit and integration tests
        run: bash ./gradlew test --no-daemon
